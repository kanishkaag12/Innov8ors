# Production overrides for docker-compose
# Usage: docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build

services:
  nginx:
    image: nginx:alpine
    container_name: synapescrow-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      frontend:
        condition: service_healthy
      backend:
        condition: service_healthy
    networks:
      - synapnet

  frontend:
    ports: [] # Remove host port binding, force traffic through nginx
    expose:
      - "3000"

  backend:
    ports: [] # Remove host port binding, force traffic through nginx
    expose:
      - "5000"
